<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730"><rect width="1100" height="730" fill="white"/><g font-family="sans-serif" font-size="18" fill="#172337"><text x="25" y="35">ID 8 · Per-node Pi Zero 2 W wiring · BCM / physical header numbers</text><rect x="25" y="80" width="330" height="520" fill="#edf4fc" stroke="#172337"/><text x="45" y="115">Pi Zero 2 W · USB 5 V power</text><text x="45" y="160">BCM17 / pin11</text><text x="690" y="160">330 Ω → RGB red</text><path d="M355 155H675" stroke="#2574a8" stroke-width="3"/><text x="45" y="210">BCM27 / pin13</text><text x="690" y="210">330 Ω → RGB green</text><path d="M355 205H675" stroke="#2574a8" stroke-width="3"/><text x="45" y="260">BCM22 / pin15</text><text x="690" y="260">330 Ω → RGB blue</text><path d="M355 255H675" stroke="#2574a8" stroke-width="3"/><text x="45" y="310">BCM23 / pin16 (pull-up)</text><text x="690" y="310">NC reed → GND</text><path d="M355 305H675" stroke="#2574a8" stroke-width="3"/><text x="45" y="360">BCM2 / pin3 SDA</text><text x="690" y="360">BH1750 SDA</text><path d="M355 355H675" stroke="#2574a8" stroke-width="3"/><text x="45" y="410">BCM3 / pin5 SCL</text><text x="690" y="410">BH1750 SCL</text><path d="M355 405H675" stroke="#2574a8" stroke-width="3"/><text x="45" y="460">3V3 / pin1</text><text x="690" y="460">BH1750 VCC</text><path d="M355 455H675" stroke="#b33" stroke-width="3"/><text x="45" y="510">GND / pin6</text><text x="690" y="510">RGB cathode; reed; BH1750 GND + ADDR</text><path d="M355 505H675" stroke="#172337" stroke-width="3"/><text x="25" y="645">Repeat on two boards. ADDR low selects BH1750 address 0x23. 3.3 V IO only.</text><text x="25" y="680">Each node ↔ private WLAN ↔ peer node, TCP 8088 /status; no inter-room electrical wire.</text><text x="25" y="715">Concept illustration is separate; use this pin map and docs/wiring.md for assembly.</text></g></svg>